# Preferencias que a pagina de Ajustes desenha e que as receitas usam.
#
# A ideia do projeto: uma paleta so em tudo. A escolha da paleta decide o tema
# das janelas, os icones, as cores do terminal e o papel de parede; o resto das
# opcoes e so o quanto de enfeite fica na tela.

[[opcao]]
chave = "paleta"
padrao = "nord"
valores = ["nord", "gruvbox", "everforest"]
titulo = "Paleta"
ajuda = "Vale para janelas, icones, terminal e papel de parede"
grupo = "Paleta"
nomes = { nord = "Nord", gruvbox = "Gruvbox", everforest = "Everforest" }
exemplos = { "nord" = "paleta-nord.png", "gruvbox" = "paleta-gruvbox.png", "everforest" = "paleta-everforest.png" }


